name: Deploy MSSP Dashboard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host ssh.stratusitsec.com
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            IdentityFile ~/.ssh/id_ed25519
          EOF

      - name: Debug key
        run: |
          wc -l ~/.ssh/id_ed25519
          head -1 ~/.ssh/id_ed25519
          tail -1 ~/.ssh/id_ed25519
          ssh-keygen -l -f ~/.ssh/id_ed25519

      - name: Deploy
        run: |
          ssh mssp-admin@ssh.stratusitsec.com "cd ~/mssp && git pull origin main && source venv/bin/activate && pip install -r requirements.txt -q && sudo systemctl restart mssp && echo 'Deployed at $(date)'"

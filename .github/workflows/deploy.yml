name: Deploy MSSP Dashboard

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          set -eu
          curl --fail --location --show-error https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -eu
          if [ -z "$SSH_PRIVATE_KEY_B64" ]; then
            echo "Missing SSH_PRIVATE_KEY secret"
            exit 1
          fi
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Missing SSH_KNOWN_HOSTS secret"
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "Missing CF_ACCESS_CLIENT_ID secret"
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "Missing CF_ACCESS_CLIENT_SECRET secret"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host ssh.stratusitsec.com
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h --id $CF_ACCESS_CLIENT_ID --secret $CF_ACCESS_CLIENT_SECRET
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            IdentitiesOnly yes
            IdentityFile ~/.ssh/id_ed25519
          EOF

      - name: Deploy
        run: |
          ssh mssp-admin@ssh.stratusitsec.com "set -eu; cd ~/mssp && git pull --ff-only origin main && . venv/bin/activate && python -m pip install -r requirements.txt -q && sudo systemctl restart mssp && echo 'Deployed at $(date)'"
